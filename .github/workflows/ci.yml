name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check
      - run: npx nx affected -t lint typecheck test build

      - run: npx playwright install --with-deps chromium
      - run: npx nx affected -t e2e

  deploy:
    # Enable by setting CLOUDFLARE_DEPLOY=true and the CLOUDFLARE_API_TOKEN /
    # CLOUDFLARE_ACCOUNT_ID secrets on the CLOUDFLARE_ENVIRONMENT environment.
    # Environment variables are not readable from a job-level `if`, so the
    # switch is checked on the steps instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: main
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_ENVIRONMENT
    steps:
      - if: vars.CLOUDFLARE_DEPLOY != 'true'
        run: echo "::notice::Deploy skipped - CLOUDFLARE_DEPLOY is not 'true'."

      - if: vars.CLOUDFLARE_DEPLOY == 'true'
        uses: actions/checkout@v5

      - if: vars.CLOUDFLARE_DEPLOY == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - if: vars.CLOUDFLARE_DEPLOY == 'true'
        run: npm ci
      - if: vars.CLOUDFLARE_DEPLOY == 'true'
        run: npx nx deploy web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
